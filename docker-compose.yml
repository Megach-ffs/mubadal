services:

  redis:
    image: redis:7-alpine
    heathcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"


  api:
    build: ./backend
    commands: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - shared_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info
    volume:
      - shared_data:/app/data

    depends_on:
      redis:
        condition: service_healthy

volumes:
  shared_data:
